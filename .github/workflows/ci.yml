name: CI

on:
  push:
    branches: 
      - "*"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Install system dependencies (integration tests + ARM cross compiler for rp2040)
        run: sudo apt-get update && sudo apt-get install -y opus-tools gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build oggopus-embedded
        run: cargo build -p oggopus-embedded --features "decode,encode"

      - name: Build opus-embedded (with stereo, encode, optimize)
        run: cargo build -p opus-embedded --features "decode,encode,stereo,optimize_libopus"

      - name: Run integration tests
        run: cargo test -p opus-embedded --features "decode,encode,stereo,optimize_libopus"

      - name: Build rp2040 example (compile only)
        run: cargo build -p example-rp2040 --target thumbv6m-none-eabi
